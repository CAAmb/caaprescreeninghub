<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CAA Pre-Screening Hub</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f2433;
    --sky:#def5ff;
    --peach:#eba380;
    --concrete:#e5e5e5;
    --white:#ffffff;
    --ink:#1c2b36;
    --muted:#5e6b75;
    --line:#d4d9dd;
    --good:#1f8a5b;
    --warn:#c47f2a;
    --bad:#b3402f;
    --shadow:0 1px 3px rgba(15,36,51,.08),0 4px 16px rgba(15,36,51,.06);
    --radius:12px;
    /* themeable surfaces */
    --surface:#ffffff;      /* cards, panels, inputs */
    --surface-2:#fafbfc;    /* subtle inset areas */
    --page:var(--concrete); /* page background */
    --zebra:#eef3f6;        /* insurer table alt rows */
    --rowdone:#e7f6ee;      /* all covers settled */
    --rowwait:#fdf0e3;      /* awaiting further info */
    --onaccent:var(--navy); /* text sitting on --sky fills */
    --bar:#0f2433;          /* navy bars: header, table heads, primary buttons */
  }
  /* ===== Dark mode ===== */
  body.dark{
    --bar:#16303f;
    --navy:#cfe3ef;         /* headings/text flip light (bars use --bar) */
    --sky:#1c3746;
    --concrete:#0a1620;
    --page:#0a1620;
    --surface:#12242f;
    --surface-2:#0e1d26;
    --ink:#e8eff3;
    --muted:#93a7b4;
    --line:#26404f;
    --zebra:#172b37;
    --rowdone:#153229;
    --rowwait:#33261a;
    --onaccent:#dceaf2;
    --good:#4cc38a;
    --warn:#e0a458;
    --bad:#e2705c;
    --shadow:0 1px 3px rgba(0,0,0,.5),0 4px 18px rgba(0,0,0,.35);
  }
  /* dark: fills that were light tints in the brand palette */
  body.dark .chip,body.dark .cx-none,body.dark .bartrack,body.dark .cxtoggle button:hover{background:#1d3140;color:var(--muted)}
  body.dark table.grid th{background:#172c39;color:#a9bdc9}
  body.dark .pill.prog{background:#3a2c17;color:#e8b874;border-color:#5a4423}
  body.dark .pill.done{background:#14301f;color:#69cf9a;border-color:#245c3c}
  body.dark .cx-Complex{background:#3c2a1d;color:#f0b58c}
  body.dark .o-Notassessed{background:#1d3140;color:#8fa3b0}
  body.dark .o-Standard{background:#14301f;color:#69cf9a}
  body.dark .o-Loaded,body.dark .o-Exclusion{background:#3a2c17;color:#e8b874}
  body.dark .o-Declined{background:#3a1e19;color:#e8968a}
  body.dark .btn.ghost:hover{background:#1d3746}
  body.dark .btn.danger{background:var(--surface);color:#e8968a;border-color:#7a3a2e}
  body.dark .btn.danger:hover{background:#3a1e19}
  body.dark .empty{border-color:var(--line)}
  body.dark input[type=date]{color-scheme:dark}
  body.dark .field input,body.dark .field select,body.dark .field textarea,
  body.dark .insurertbl input,body.dark .insurertbl select,body.dark .insurertbl textarea,
  body.dark .search input,body.dark .casenotes{color:var(--ink)}
  body.dark .summarybox strong{color:#8fd0f0}
  body.dark .modal{border:1px solid var(--line)}
  body.dark #loginView{background:linear-gradient(180deg,#060f16 0%,#0b1c29 45%,#12303f 100%)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--page);
    color:var(--ink);
    font-size:14px;
    line-height:1.45;
  }
  h1,h2,h3,h4{margin:0;font-weight:650;color:var(--navy)}
  a{color:inherit}
  button{font-family:inherit;font-size:14px;cursor:pointer}

  /* ---------- App chrome ---------- */
  header.topbar{
    background:var(--bar);color:#fff;padding:14px 32px;
    display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;
  }
  .brandmark{
    width:40px;height:40px;flex:0 0 auto;color:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .brandtext b{display:block;font-size:16px;line-height:1.1}
  .brandtext span{font-size:11.5px;opacity:.7;letter-spacing:.3px}
  .topbar .spacer{flex:1}
  .topbar .crumb{font-size:13px;opacity:.85}
  .topbar .crumb b{opacity:1}

  .wrap{max-width:1680px;margin:0 auto;padding:24px 32px}

  /* ---- Brand logo ---- */
  .ca-mark{width:100%;height:100%;display:block}
  .brandlogo{height:46px;width:auto;display:block;flex:0 0 auto}
  .appname{margin-left:18px;padding-left:18px;border-left:1px solid rgba(255,255,255,.28);color:#fff;font-size:16px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
  .login-logo img{max-height:104px;width:auto;display:block;margin:0 auto 8px}
  /* ---- Login / landing ---- */
  #loginView{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
    background:
      radial-gradient(75% 48% at 50% 110%, rgba(235,163,128,.75), rgba(222,245,255,.30) 45%, transparent 72%),
      linear-gradient(180deg,#0b1c29 0%, #0f2433 42%, #18394b 68%, #4a7289 100%);
    -webkit-print-color-adjust:exact;print-color-adjust:exact;padding:24px}
  body.signed-out #loginView{display:flex}
  body.signed-out > header.topbar, body.signed-out > .wrap{display:none}
  .login-card{width:100%;max-width:460px;text-align:center;color:#fff}
  .login-mark{width:88px;height:88px;margin:0 auto 10px;color:#fff}
  .login-wordmark{font-size:15px;letter-spacing:.5px;opacity:.9;font-weight:600}
  .login-title{font-size:27px;font-weight:750;color:#fff;margin:22px 0 6px;line-height:1.15}
  .login-tag{font-size:14px;opacity:.85;margin:0 0 26px;font-weight:400}
  .login-btn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#0f2433;border:none;
    padding:13px 26px;border-radius:30px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.22);transition:transform .1s,box-shadow .1s}
  .login-btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(0,0,0,.28)}
  .login-btn:disabled{opacity:.6;cursor:default;transform:none}
  .login-note{font-size:12.5px;opacity:.8;margin:16px 0 0}
  .login-err{font-size:12.5px;color:#fff;background:rgba(179,64,47,.55);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:8px 12px;margin:16px auto 0;max-width:400px;display:none}
  .login-foot{position:fixed;left:0;right:0;bottom:16px;text-align:center;font-size:10.5px;color:rgba(255,255,255,.75);padding:0 24px;line-height:1.5}
  .ms-logo{width:17px;height:17px;flex:0 0 auto}
  /* signed-in user chip in header */
  .userchip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#fff;margin-left:14px}
  .userchip .uc-name{opacity:.9}
  .userchip .uc-out{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 9px;font-size:11.5px;font-weight:600;cursor:pointer}
  .userchip .uc-out:hover{background:rgba(255,255,255,.24)}
  .syncstat{font-size:11.5px;margin-left:12px;color:rgba(255,255,255,.85);white-space:nowrap}
  .syncstat.ok{color:#bfe8cf}
  .syncstat.busy{color:#fff;opacity:.9}
  .syncstat.err{color:#ffb4a6;font-weight:700}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bar);color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9999;max-width:80vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:#8a2f22}

  /* ---------- Buttons ---------- */
  .btn{
    border:1px solid var(--bar);background:var(--bar);color:#fff;
    padding:8px 14px;border-radius:8px;font-weight:600;display:inline-flex;
    align-items:center;gap:7px;line-height:1;transition:filter .12s,background .12s;
  }
  .btn:hover{filter:brightness(1.12)}
  .btn.ghost{background:var(--surface);color:var(--navy)}
  .btn.ghost:hover{background:var(--sky);filter:none}
  .btn.peach{background:var(--peach);border-color:var(--peach);color:var(--navy)}
  .btn.sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
  .btn.danger{background:var(--surface);color:var(--bad);border-color:var(--bad)}
  .btn.danger:hover{background:#fbe9e6;filter:none}
  .icnbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:7px;padding:5px 9px;font-size:12.5px;font-weight:600}
  .icnbtn:hover{border-color:var(--navy);color:var(--navy)}

  /* ---------- Dashboard ---------- */
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:22px}
  .stat{background:var(--surface);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow);border-left:4px solid var(--sky)}
  .stat:nth-child(2){border-left-color:var(--peach)}
  .stat:nth-child(3){border-left-color:var(--good)}
  .stat:nth-child(4){border-left-color:var(--warn)}
  .stat:nth-child(5){border-left-color:var(--navy)}
  .stat .num{font-size:30px;font-weight:750;color:var(--navy);line-height:1}
  .stat .lbl{font-size:12.5px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.4px}
  .stat.clickable{cursor:pointer;transition:transform .06s,box-shadow .12s}
  .stat.clickable:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(15,36,51,.14)}

  /* dashboard */
  .pagehead{display:flex;align-items:center;gap:16px;margin-bottom:18px}
  .pagehead .pagetitle{font-size:22px;font-weight:700;color:var(--navy);flex:1;margin:0}
  .dashrow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  .minicard{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
  .minicard h3{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:0 0 10px;font-weight:600}
  .minicard .mcstat{font-size:14px;color:var(--ink);padding:4px 0;display:flex;align-items:center;gap:8px}
  .minicard .mcstat b{color:var(--navy);font-size:16px}
  .barrow{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line)}
  .barrow:last-child{border-bottom:none}
  .barrow .bname{font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bartrack{background:var(--concrete);border-radius:6px;height:16px;overflow:hidden}
  .barfill{height:100%;background:var(--peach);border-radius:6px;min-width:2px}
  .barval{color:var(--muted);white-space:nowrap;font-size:12px}
  .barval b{color:var(--navy)}
  .dashnav{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}

  .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .search{flex:1;min-width:220px;position:relative}
  .search input{
    width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);
    border-radius:9px;font-size:14px;background:var(--surface);
  }
  .search input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,36,51,.08)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45}

  .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:4px}
  .tabs button{border:none;background:none;padding:7px 16px;border-radius:6px;font-weight:600;color:var(--muted)}
  .tabs button.active{background:var(--bar);color:#fff}

  .caselist{display:flex;flex-direction:column;gap:12px}
  .casecard{
    background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;
    border:1px solid transparent;transition:border-color .12s,transform .06s;
  }
  .casecard:hover{border-color:var(--sky);transform:translateY(-1px)}
  .avatar{
    width:46px;height:46px;border-radius:50%;flex:0 0 auto;background:var(--sky);
    color:var(--navy);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .casecard .cmain{flex:1;min-width:0}
  .casecard .cname{font-size:15.5px;font-weight:650;color:var(--navy)}
  .casecard .cmeta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .casecard .ctags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--concrete);color:var(--muted)}
  .chip.cat{background:var(--sky);color:var(--navy)}

  .casecard .cright{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto}
  .daysbadge{color:var(--good)}
  .cx{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:middle;letter-spacing:.2px}
  .cx-Simple{background:var(--sky);color:var(--navy)}
  .cx-Complex{background:#fdeee0;color:#9a5a25}
  .cx-none{background:var(--concrete);color:var(--muted);font-weight:600}
  .cxtoggle{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .cxtoggle button{border:none;background:var(--surface);color:var(--muted);padding:5px 11px;font-size:11.5px;font-weight:600;cursor:pointer;transition:background .1s}
  .cxtoggle button:first-child{border-right:1px solid var(--line)}
  .cxtoggle button:hover{background:var(--concrete)}
  .cxtoggle button.on{background:var(--sky);color:var(--navy)}
  .cxtoggle button.on.complex{background:var(--peach);color:var(--navy)}
  .pill{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;white-space:nowrap}
  .pill.prog{background:#fff4e7;color:var(--warn);border:1px solid #f0d4ad}
  .pill.done{background:#e6f6ee;color:var(--good);border:1px solid #b9e3cd}

  .empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:48px;text-align:center;color:var(--muted)}

  /* ---------- Detail view ---------- */
  .detailhead{display:flex;align-items:flex-start;gap:18px;margin-bottom:20px;flex-wrap:wrap}
  .detailhead .big{font-size:24px}
  .detailhead .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .detailhead .actions{display:flex;gap:8px;flex-wrap:wrap}

  .panelgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
  .panel-tall{grid-row:span 2}
  .panel-tall.collapsed{grid-row:auto}
  .panel{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;align-self:start}
  .panel > h3{
    background:var(--bar);color:#fff;font-size:11.5px;padding:8px 12px;
    text-transform:uppercase;letter-spacing:.5px;font-weight:600;
    display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
  }
  .panel > h3 .chev{font-size:9px;transition:transform .15s;opacity:.85}
  .panel.collapsed > h3 .chev{transform:rotate(-90deg)}
  .panel.collapsed .pbody{display:none}
  .panel .pbody{padding:10px 12px}
  .kv{display:grid;grid-template-columns:44% 56%;gap:4px 8px;font-size:12px}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0;color:var(--ink);font-weight:500;word-break:break-word}
  .summarybox{font-size:13px;line-height:1.6;color:var(--ink);max-height:440px;overflow:auto}
  .summarybox strong{color:var(--navy)}
  .casenotes{width:100%;min-height:88px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:13px;resize:vertical}
  .casenotes:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,36,51,.08)}

  .section{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
  .section > .shead{
    padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);
  }
  .section > .shead h2{font-size:16px;flex:1}
  .section > .sbody{padding:16px 18px}

  table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
  table.grid th{
    text-align:left;background:var(--concrete);color:var(--muted);font-weight:600;
    padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;
  }
  table.grid td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.grid tr:last-child td{border-bottom:none}
  table.grid tr:hover td{background:var(--surface-2)}
  .rowact{display:flex;gap:5px}

  /* insurer cards */
  .insurergrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .insurercard{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
  .insurercard .ihead{background:var(--sky);padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
  .insurercard .ihead h4{font-size:15px;flex:1}
  .insurercard .ihead .idates{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
  .coverrow{padding:10px 14px;border-bottom:1px solid var(--line)}
  .coverrow:last-of-type{border-bottom:none}
  .coverrow .ctop{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .coverrow .cname2{font-weight:700;font-size:12.5px;color:var(--navy);width:130px}
  .coverrow .cdetail{font-size:11.5px;color:var(--muted);margin-top:2px;padding-left:0}
  .outcome{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.3px}
  .o-Standard{background:#e6f6ee;color:var(--good)}
  .o-Loaded{background:#fff4e7;color:var(--warn)}
  .o-Exclusion{background:#fdeee0;color:#9a5a25}
  .o-Postponed{background:#eef0f2;color:var(--muted)}
  .o-Declined{background:#fbe9e6;color:var(--bad)}
  .o-Notassessed{background:#eef0f2;color:#9aa4ad}
  .inotes{padding:10px 14px;font-size:12px;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line)}
  .inotes b{color:var(--ink)}

  /* insurer table */
  .insurerscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table.insurertbl{width:100%;border-collapse:collapse;font-size:12px;min-width:960px}
  .insurertbl th{background:var(--bar);color:#fff;text-align:left;padding:9px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  .insurertbl td{border-bottom:2px solid var(--line);padding:10px 8px;vertical-align:top;background:var(--surface)}
  .insurertbl tbody tr:nth-child(even) td{background:var(--zebra)}
  .insurertbl tbody tr:hover td{background:var(--sky)}
  .insurertbl tbody tr.row-complete td{background:var(--rowdone) !important}
  .insurertbl tbody tr.row-awaiting td{background:var(--rowwait) !important}
  .insurertbl tr:last-child td{border-bottom:none}
  .insurertbl td.insurercell{border-left:4px solid var(--bar)}
  .insurertbl tbody tr:nth-child(even) td.insurercell{border-left-color:var(--peach)}
  .insurertbl select,.insurertbl input,.insurertbl textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:11.5px;font-family:inherit;background:var(--surface)}
  .insurertbl select:focus,.insurertbl input:focus,.insurertbl textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 2px rgba(15,36,51,.1)}
  .insurertbl .celltype{font-weight:700;color:var(--navy)}
  .insurertbl .mini{margin-top:5px}
  .insurertbl .nm{font-weight:650}
  .insurertbl .dates{display:flex;gap:6px;margin-top:6px}
  .insurertbl .dates label{font-size:9px;color:var(--muted);flex:1}
  .insurertbl .dates input{padding:3px 4px;font-size:10.5px}
  .insurertbl textarea.notes{min-height:44px;resize:vertical;overflow:hidden}
  .insurertbl .occinput{margin-top:6px;padding:3px 6px;font-size:10.5px}
  .insurertbl td.covercell{min-width:150px}
  .insurertbl td.insurercell{min-width:180px}
  .insurertbl td.notes{min-width:260px}

  .rawbox{
    background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;
    font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12px;
    white-space:pre-wrap;color:var(--ink);max-height:340px;overflow:auto;line-height:1.6;
  }

  /* ---------- Modal ---------- */

/* ===================== STATE / STORAGE ===================== */
let DB = [];
let currentTab = "In Progress";
let searchTerm = "";
let openCaseId = null;
let editingCover = null; // {ioId, key} — inline per-cover edit on detail screen
const collapsedPanels = new Set(); // detail-view panels the user has collapsed (persists across re-renders)

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ DB = JSON.parse(raw); }
    else { DB = seedData(); save(); }
  }catch(e){ DB = seedData(); }
  normalize();
}
// Fill any fields added in later versions so older saved cases don't break.
function normalize(){
  DB.forEach(c=>{
    if(c.complexity===undefined) c.complexity="";
    if(c.preScreeningDate===undefined) c.preScreeningDate="";
    if(c.assessmentCompletedDate===undefined) c.assessmentCompletedDate="";
  });
}
function save(){ /* data now persists to SharePoint via Graph, not localStorage */ }
function getCase(id){ return DB.find(c=>c.id===id); }
function uid(p){ return p + "-" + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function age(dob){ if(!dob)return"";const d=new Date(dob);const t=new Date();let a=t.getFullYear()-d.getFullYear();if(t<new Date(t.getFullYear(),d.getMonth(),d.getDate()))a--;return a; }
function initials(c){ const p=(c.fullName||"").trim().split(/\s+/); const a=(p[0]||"?")[0]||"?"; const b=p.length>1?(p[p.length-1][0]||""):""; return (a+b).toUpperCase(); }
function fmtDate(d){ return d?d:"—"; }
function val(v){ return (v===0||v)?esc(v):"—"; }
function todayStr(){ const d=new Date(); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function daysToComplete(c){ return daysBetween(c.preScreeningDate,c.assessmentCompletedDate); }
function daysBetween(a,b){ if(!a||!b)return null; const d1=new Date(a),d2=new Date(b); if(isNaN(d1)||isNaN(d2))return null; return Math.max(0,Math.round((d2-d1)/86400000)); }

function showDashboard(){
  openCaseId=null; editingCover=null;
  document.getElementById("view-detail").classList.add("hidden");

  document.body.classList.remove("viewing-case");

}

  if(tab) currentTab=tab;
  openCaseId=null; editingCover=null;
  document.getElementById("view-detail").classList.add("hidden");
  document.getElementById("view-dashboard").classList.remove("hidden");

  if(id!==openCaseId) editingCover=null;

}

/* ===================== DASHBOARD (metrics) ===================== */
function renderDashboard(){
  const total=DB.length;
  const inProg=DB.filter(c=>c.status==="In Progress").length;
  const complete=DB.filter(c=>c.status==="Complete").length;
  const doneDays=DB.filter(c=>c.status==="Complete").map(daysToComplete).filter(n=>n!=null);
  const avgDays=doneDays.length?Math.round(doneDays.reduce((a,b)=>a+b,0)/doneDays.length):null;

  // insurer response analytics
  const outcomes=DB.flatMap(c=>c.insurerOutcomes||[]);
  const respDays=outcomes.filter(io=>io.dateSent&&io.dateReceived).map(io=>daysBetween(io.dateSent,io.dateReceived)).filter(n=>n!=null);
  const avgResp=respDays.length?Math.round(respDays.reduce((a,b)=>a+b,0)/respDays.length):null;
  const receivedCount=respDays.length;
  const pendingResp=outcomes.filter(io=>io.dateSent&&!io.dateReceived).length;
  const byIns={};
  outcomes.forEach(io=>{
    const n=(io.insurerName||"").trim(); if(!n)return;
    const r=(byIns[n]=byIns[n]||{sum:0,count:0,pending:0});
    if(io.dateSent&&io.dateReceived){ const d=daysBetween(io.dateSent,io.dateReceived); if(d!=null){ r.sum+=d; r.count++; } }
    else if(io.dateSent&&!io.dateReceived){ r.pending++; }
  });
  const insRows=Object.keys(byIns).map(n=>({name:n,avg:byIns[n].count?Math.round(byIns[n].sum/byIns[n].count):null,count:byIns[n].count,pending:byIns[n].pending}))
    .filter(r=>r.count||r.pending).sort((a,b)=>(b.avg||0)-(a.avg||0));
  const maxAvg=Math.max(1,...insRows.map(r=>r.avg||0));

  const simple=DB.filter(c=>c.complexity==="Simple").length;
  const cplx=DB.filter(c=>c.complexity==="Complex").length;
  const unass=DB.filter(c=>!c.complexity).length;

  document.getElementById("view-dashboard").innerHTML = `
    <div class="pagehead"><h1 class="pagetitle">Dashboard</h1><button class="btn peach" onclick="openCaseModal()">+ New Case</button></div>
    <div class="stats">
      <div class="stat"><div class="num">${total}</div><div class="lbl">Total cases</div></div>
      <div class="stat clickable" onclick="showCases('In Progress')"><div class="num">${inProg}</div><div class="lbl">In progress →</div></div>
      <div class="stat clickable" onclick="showCases('Complete')"><div class="num">${complete}</div><div class="lbl">Complete →</div></div>
      <div class="stat"><div class="num">${avgDays!=null?avgDays:"—"}</div><div class="lbl">Avg days to complete</div></div>
      <div class="stat"><div class="num">${avgResp!=null?avgResp:"—"}</div><div class="lbl">Avg insurer response (days)</div></div>
    </div>
    <div class="dashrow">
      <div class="minicard"><h3>Insurer responses</h3>
        <div class="mcstat"><b>${receivedCount}</b> received</div>
        <div class="mcstat"><b>${pendingResp}</b> awaiting response</div>
        <div class="mcstat"><b>${avgResp!=null?avgResp+" day"+(avgResp!==1?"s":""):"—"}</b> average turnaround</div>
      </div>
      <div class="minicard"><h3>Case complexity</h3>
        <div class="mcstat"><span class="cx cx-Simple">Simple</span> <b>${simple}</b></div>
        <div class="mcstat"><span class="cx cx-Complex">Complex</span> <b>${cplx}</b></div>
        <div class="mcstat"><span class="cx cx-none">Unassigned</span> <b>${unass}</b></div>
      </div>
    </div>
    <div class="section">
      <div class="shead"><h2>Average response time by insurer</h2><span class="muted" style="font-size:12px">days from sent → received</span></div>
      <div class="sbody">
        ${insRows.length? insRows.map(r=>`
          <div class="barrow">
            <div class="bname">${esc(r.name)}</div>
            <div class="bartrack"><div class="barfill" style="width:${r.avg?Math.round((r.avg/maxAvg)*100):2}%"></div></div>
            <div class="barval">${r.avg!=null?`<b>${r.avg} day${r.avg!==1?"s":""}</b> · ${r.count} resp`:`no responses yet`}${r.pending?` · ${r.pending} pending`:""}</div>
          </div>`).join("") : `<div class="empty">No insurer responses recorded yet.</div>`}
      </div>
    </div>
    <div class="dashnav">
      <button class="btn" onclick="showCases('In Progress')">View In Progress (${inProg}) →</button>
      <button class="btn ghost" onclick="showCases('Complete')">View Complete (${complete}) →</button>
    </div>
  `;
}

function renderCases(){
  const filtered = DB.filter(c=>c.status===currentTab).filter(c=>matchSearch(c));
  let cards = filtered.map(c=>{
    const cats=[...new Set(c.healthIssues.map(h=>h.category))];
    const tagHtml = cats.map(t=>`<span class="chip cat">${esc(t)}</span>`).join("")
      + `<span class="chip">${c.healthIssues.length} issue${c.healthIssues.length!==1?"s":""}</span>`
      + `<span class="chip">${c.insurerOutcomes.length} insurer${c.insurerOutcomes.length!==1?"s":""}</span>`;
    const cx=c.complexity||"";
    const cxBadge = cx?`<span class="cx cx-${cx}">${esc(cx)}</span>`:`<span class="cx cx-none">Unassigned</span>`;
    const days=daysToComplete(c);
    const dateLine = `Pre-screening completed: <b>${c.preScreeningDate||"—"}</b>`
      + (c.status==="Complete" && days!=null ? ` · Assessment completed: <b>${esc(c.assessmentCompletedDate)}</b> · <b class="daysbadge">${days} day${days!==1?"s":""} to complete</b>` : "");
    return `<div class="casecard" onclick="showDetail('${c.id}')">
      <div class="avatar">${initials(c)}</div>
      <div class="cmain">
        <div class="cname">${esc(c.fullName)} ${cxBadge}</div>

        <div class="ctags">${tagHtml}</div>
      </div>
      <div class="cright" onclick="event.stopPropagation()">
        <div class="cxtoggle" title="Assign case complexity">
          <button class="${cx==="Simple"?"on":""}" onclick="setComplexity('${c.id}','Simple')">Simple</button>

  document.getElementById("view-dashboard").innerHTML = `
    <div class="pagehead"><button class="btn ghost sm" onclick="showDashboard()">← Dashboard</button><h1 class="pagetitle">Cases</h1></div>

        <input id="searchInput" placeholder="Search by name, ID, occupation, condition…" value="${esc(searchTerm)}" oninput="onSearch(this.value)">
      </div>
      <div class="tabs">
        <button class="${currentTab==="In Progress"?"active":""}" onclick="setTab('In Progress')">In Progress</button>
        <button class="${currentTab==="Complete"?"active":""}" onclick="setTab('Complete')">Complete</button>
      </div>
      <button class="btn peach" onclick="openCaseModal()">+ New Case</button>
    </div>
    <div class="caselist">${cards}</div>
  `;
}
function matchSearch(c){
  if(!searchTerm)return true;
  const t=searchTerm.toLowerCase();
  const hay=[c.fullName,c.id,c.occupation,c.employer,
    ...c.healthIssues.map(h=>h.category+" "+h.diagnosis),
    ...c.insurerOutcomes.map(io=>io.insurerName)].join(" ").toLowerCase();
  return hay.includes(t);
}
function onSearch(v){ searchTerm=v; renderCases(); document.getElementById("searchInput").focus(); }
function setTab(t){ currentTab=t; renderCases(); }
function setComplexity(id,val){ const c=getCase(id); c.complexity=(c.complexity===val?"":val); c.lastUpdated=todayStr(); renderCases(); persist(saveSubmissionRemote(c)); }

/* ===================== PRINT REPORT (landscape) ===================== */
function reportFilename(c){
  const d=new Date(); const p=n=>String(n).padStart(2,"0");
  const ymd=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  const name=(c.fullName||"").trim().replace(/[\\/:*?"<>|]/g,"").replace(/\s+/g," ");
  return `${ymd} - ${name||"Client"} - Pre Assessment Report`;
}
function pdfCoverFill(type){
  switch(type){
    case "Standard": return [230,246,238];
    case "Loading %": case "Loading $": return [255,244,231];
    case "Exclusion": return [253,238,224];
    case "Loading % and Exclusion": case "Loading $ and Exclusion": return [255,227,207];
    case "Declined": return [251,233,230];
    case "Further information": return [231,240,251];
    default: return [255,255,255];
  }
}
// Native vector PDF (jsPDF + AutoTable) — portrait A4, branded report.
function exportPdf(caseId, mode){
  const c=getCase(caseId);
  const filename=reportFilename(c)+".pdf";
  const btn=document.getElementById(mode==="print"?"printBtn":"exportBtn");
  if(!window.jspdf||!window.jspdf.jsPDF){ alert("PDF library not loaded — check jspdf.umd.min.js is present."); return; }
  if(btn){ btn.disabled=true; btn.textContent="Generating…"; }
  try{
    const { jsPDF }=window.jspdf;
    const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    const NAVY=[15,36,51], SKY=[222,245,255], PEACH=[235,163,128], INK=[28,43,54], MUTED=[110,122,132], LINE=[214,221,226], ALT=[247,249,250];
    const pageW=doc.internal.pageSize.getWidth(), pageH=doc.internal.pageSize.getHeight();
    const M=14, usable=pageW-2*M;
    const name=(c.fullName||"").trim()||"—";
    const days=daysToComplete(c);
    const BAND=38, CONT=22; // CONT = content start on continuation pages (slim 14mm band + gap)

    /* ---------- page furniture ---------- */
    const logoEl=document.querySelector(".brandlogo");
    const hasLogo = logoEl && logoEl.naturalWidth>0;
    function drawBand(){
      doc.setFillColor(...NAVY); doc.rect(0,0,pageW,BAND,"F");
      doc.setFillColor(...PEACH); doc.rect(0,BAND-1.2,pageW,1.2,"F");
      if(hasLogo){
        const h=19, w=h*(logoEl.naturalWidth/logoEl.naturalHeight);
        try{ doc.addImage(logoEl,"PNG",M,(BAND-1.2-h)/2,w,h); }catch(e){ bandText(); }
      } else bandText();
      doc.setTextColor(255); doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
      doc.text("Insurance Pre-Screening Report", pageW-M, 17, {align:"right"});
      doc.setFontSize(7.5); doc.setTextColor(200,215,225);
      doc.text("Confidential", pageW-M, 22.5, {align:"right"});
    }
    function bandText(){
      doc.setTextColor(255); doc.setFont("helvetica","bold"); doc.setFontSize(14);
      doc.text("Coastal Advisory Australia", M, 17);
      doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(200,215,225);
      doc.text("Plan everything. Regret nothing.", M, 23);
    }
    drawBand();

    /* ---------- title block ---------- */
    let y=BAND+11;
    doc.setTextColor(...NAVY); doc.setFont("helvetica","bold"); doc.setFontSize(19);
    doc.text(name, M, y);
    // status + complexity pills
    let px=M;
    y+=6;
    const pill=(txt,fill,txtCol)=>{
      doc.setFont("helvetica","bold"); doc.setFontSize(7.5);
      const w=doc.getTextWidth(txt)+7;
      doc.setFillColor(...fill); doc.roundedRect(px,y-3.6,w,5.6,2.8,2.8,"F");
      doc.setTextColor(...txtCol); doc.text(txt,px+3.5,y);
      px+=w+4;
    };
    pill(c.status||"In Progress", c.status==="Complete"?[230,246,238]:[255,244,231], c.status==="Complete"?[31,138,91]:[196,127,42]);
    pill(c.complexity||"Unassigned", c.complexity==="Complex"?[253,238,224]:(c.complexity==="Simple"?SKY:[235,238,240]), c.complexity?NAVY:MUTED);
    doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
    doc.text(`Ref ${c.id}  ·  ${age(c.dob)} yrs  ·  ${c.gender||"—"}  ·  ${c.occupation||"—"}`, px+2, y);
    y+=8;

    // meta strip
    doc.setFillColor(...SKY); doc.roundedRect(M,y,usable,9,2,2,"F");
    doc.setFontSize(7.8); doc.setTextColor(...INK);
    const meta=[["Pre-screening", c.preScreeningDate||"—"],["Assessment completed", c.assessmentCompletedDate||"—"],["Days to complete", days!=null?(days+" day"+(days!==1?"s":"")):"—"],["Generated", todayStr()]];
    const step=usable/4;
    meta.forEach((m,i)=>{
      const x=M+4+i*step;
      doc.setFont("helvetica","normal"); doc.setTextColor(...MUTED); doc.text(m[0], x, y+3.6);
      doc.setFont("helvetica","bold"); doc.setTextColor(...NAVY); doc.text(String(m[1]), x, y+7.2);
    });
    y+=15;

    /* ---------- helpers ---------- */
    const need=(mm)=>{ if(y+mm>pageH-16){ doc.addPage(); y=CONT; } };
    const sectionTitle=(t)=>{
      need(16);
      doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...NAVY);
      doc.text(t,M,y);
      y+=2; doc.setDrawColor(...PEACH); doc.setLineWidth(0.8); doc.line(M,y,M+22,y);
      doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M+22,y,pageW-M,y);
      y+=4.5;
    };
    const tbl={theme:"grid",
      styles:{fontSize:7.6,cellPadding:2,overflow:"linebreak",lineColor:LINE,lineWidth:0.15,textColor:INK,valign:"top"},
      headStyles:{fillColor:NAVY,textColor:255,fontSize:7,fontStyle:"bold",cellPadding:2.2},
      alternateRowStyles:{fillColor:ALT},
      margin:{left:M,right:M,top:CONT,bottom:18}};
    // key/value section — short values pack 2-per-line; long values get their own full-width row.
    // (Keeps rows uniform so labels never drift away from their values.)
    function kvTable(rows){
      const shortR=[], longR=[];
      rows.forEach(r=>{
        if(!r||!r[0]) return;
        const v=cleanVal(r[1]);
        (v.length>52 ? longR : shortR).push([r[0], v||"—"]);
      });
      const pairs=[];
      for(let i=0;i<shortR.length;i+=2){
        const a=shortR[i], b=shortR[i+1];
        pairs.push([a[0],a[1], b?b[0]:"", b?b[1]:""]);
      }
      if(pairs.length){
        doc.autoTable({...tbl, startY:y, body:pairs,
          styles:{...tbl.styles,fontSize:7.4,cellPadding:1.8},
          columnStyles:{0:{cellWidth:38,textColor:MUTED},1:{cellWidth:53,fontStyle:"bold"},2:{cellWidth:38,textColor:MUTED},3:{cellWidth:53,fontStyle:"bold"}}});
        y=doc.lastAutoTable.finalY;
      }
      if(longR.length){
        doc.autoTable({...tbl, startY:y, body:longR,
          styles:{...tbl.styles,fontSize:7.4,cellPadding:1.8},
          columnStyles:{0:{cellWidth:38,textColor:MUTED},1:{cellWidth:usable-38}}});
        y=doc.lastAutoTable.finalY;
      }
      y+=7;
    }

    /* ---------- AI summary ---------- */
    /* ---------- assessor notes & recommendation (lead section — highlighted) ---------- */
    {
      const notes=(c.assessorNotes && c.assessorNotes.trim()) ? c.assessorNotes.trim() : "No assessor notes recorded.";
      const padX=6, textW=usable-padX*2;
      doc.setFont("helvetica","normal"); doc.setFontSize(9.2);
      const paras=notes.split("\n");
      const wrapped=[];
      paras.forEach(p=>{ if(!p.trim()){ wrapped.push(null); return; } doc.splitTextToSize(p, textW).forEach(s=>wrapped.push(s)); });
      const boxH=wrapped.reduce((h,l)=>h+(l===null?2.4:4.6),0)+13;
      need(boxH+4);
      doc.setFillColor(...SKY); doc.setDrawColor(...NAVY); doc.setLineWidth(0.4);
      doc.roundedRect(M,y,usable,boxH,2.5,2.5,"FD");
      doc.setFillColor(...NAVY); doc.rect(M,y,2.4,boxH,"F");
      doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(...NAVY);
      doc.text("Assessor Notes & Recommendation", M+padX, y+6.6);
      doc.setFont("helvetica","normal"); doc.setFontSize(9.2); doc.setTextColor(...INK);
      let ty=y+12.4;
      wrapped.forEach(l=>{ if(l===null){ ty+=2.4; return; } doc.text(l, M+padX, ty); ty+=4.6; });
      y+=boxH+8;
    }

    /* ---------- AI summary ---------- */
    if(c.cleanSummary && c.cleanSummary.trim()){
      sectionTitle("Summary");
      doc.setFontSize(8.6);
      c.cleanSummary.split("\n").forEach(raw=>{
        const line=raw.replace(/\s+$/,"");
        const t=line.trim();
        if(!t){ y+=2.6; return; }
        const isHeading = t.length<=42 && t===t.toUpperCase() && /[A-Z]/.test(t);
        doc.setFont("helvetica", isHeading?"bold":"normal");
        doc.setFontSize(8.6);
        doc.setTextColor(...(isHeading?NAVY:INK));
        if(isHeading) y+=1.5;
        doc.splitTextToSize(line, usable).forEach(seg=>{ need(6); doc.text(seg, M, y); y+=4.1; });
        if(isHeading) y+=0.8;
      });
      y+=5;
    }

    /* ---------- client details ---------- */
    sectionTitle("Client Details");
    kvTable([["Full name",name],["Date of birth",c.dob?`${c.dob} (${age(c.dob)})`:""],["Gender",c.gender],["Smoker (12m)",c.smokerLast12m],
      ["Living in Australia",c.livingInAustralia],["Citizen or PR",c.citizenOrPR],["Applied for PR",c.appliedForPR],["Current visa",c.currentVisaDetail],
      ["Overseas location",c.overseasLocationDetail],["Travel abroad (2yrs)",c.plansToTravel2yrs],["Travel plans",c.travelPlansDetail]]);

    sectionTitle("Occupational & Financial");
    kvTable([["Currently working",c.currentlyWorking],["Occupation",c.occupation],["Employer",c.employer],["Annual income",c.annualIncome?("$"+Number(c.annualIncome).toLocaleString()):""],
      ["Employment status",c.employmentStatus],["Hours / weeks",c.hoursWeeksWorked],["Duties breakdown",c.dutiesBreakdown],["Hazardous duties",c.hazardousDuties],
      ["Self-employment",c.selfEmploymentDetail],["Bonus/comm >20%",c.bonusCommissionOver20],["Second job",c.secondJob],["Second job detail",c.secondJobDetail],
      ["Plans to change job",c.plansToChangeJob],["Job change detail",c.jobChangeDetail],["Bankruptcy",c.bankruptcyStatus],["Bankruptcy detail",c.bankruptcyDetail]]);

    sectionTitle("Lifestyle & General Health");
    kvTable([["Height / weight",hwLine(c)],["Weight changed (12m)",c.weightChanged12m],["Weight change detail",c.weightChangeDetail],["High blood pressure",c.highBloodPressure],
      ["BP detail",c.bpDetail],["High cholesterol",c.highCholesterol],["Cholesterol detail",c.cholesterolDetail],["Alcohol / week",c.alcoholPerWeek],
      ["Advised reduce alcohol",c.alcoholReductionAdvised],["Advice date",c.alcoholAdviceDate],["Rec. drugs (10yrs)",c.recreationalDrugs10yrs],["Drug detail",c.drugDetail],
      ["Hazardous pastimes",c.hazardousPastimes],["Activity detail",c.hazardousActivityDetail]]);

    /* ---------- health issues ---------- */
    sectionTitle(`Health Issues (${c.healthIssues.length})`);
    {
      const body=[], meta=[];
      c.healthIssues.forEach(h=>{
        const area=cleanVal(h.bodyArea), d1=cleanVal(h.dateFirstSymptoms), d2=cleanVal(h.dateLastSymptoms);
        body.push([cleanVal(h.category)||"—",(cleanVal(h.diagnosis)||"—")+(area?`\n${area}`:""),`${d1||"—"} → ${d2||"—"}`,cleanVal(h.treatmentStatus)||"—",h.surgery==="Yes"?("Yes"+(cleanVal(h.surgeryDate)?`\n${cleanVal(h.surgeryDate)}`:"")):"No",cleanVal(h.fullyRecovered)||"—"]);
        meta.push("main");
        const extras=[];
        if(cleanVal(h.severity)) extras.push("Severity: "+cleanVal(h.severity));
        if(cleanVal(h.occupationRelated)) extras.push("Occupation related: "+cleanVal(h.occupationRelated));
        if(cleanVal(h.timeOffWork)) extras.push("Time off work: "+cleanVal(h.timeOffWork));
        if(cleanVal(h.assessorNotes)) extras.push("Notes: "+cleanVal(h.assessorNotes));
        if(extras.length){ body.push([{content:extras.join("   ·   "),colSpan:6}]); meta.push("sub"); }
      });
      doc.autoTable({...tbl, startY:y,
        head:[["Category","Diagnosis / area","Symptom dates","Treatment","Surgery","Recovered"]],
        body: body.length?body:[[{content:"No health issues recorded.",colSpan:6,styles:{textColor:MUTED,fontStyle:"italic"}}]],
        columnStyles:{0:{cellWidth:26,fontStyle:"bold"},1:{cellWidth:44},2:{cellWidth:30},3:{cellWidth:24},4:{cellWidth:26},5:{cellWidth:32}},
        didParseCell:(d)=>{ if(d.section==="body"&&meta[d.row.index]==="sub"){ d.cell.styles.fontSize=6.9; d.cell.styles.textColor=MUTED; d.cell.styles.fillColor=[252,253,253]; } }
      });
      y=doc.lastAutoTable.finalY+7;
    }

    /* ---------- family history ---------- */
    sectionTitle(`Family History (${c.familyHistory.length})`);
    doc.autoTable({...tbl, startY:y,
      head:[["Condition","Family member","Age at diagnosis"]],
      body: c.familyHistory.length? c.familyHistory.map(f=>[f.condition||"—",f.familyMember||"—",(f.ageAtDiagnosis===0||f.ageAtDiagnosis)?String(f.ageAtDiagnosis):"—"]) : [[{content:"No family history recorded.",colSpan:3,styles:{textColor:MUTED,fontStyle:"italic"}}]],
      columnStyles:{0:{cellWidth:92,fontStyle:"bold"},1:{cellWidth:58},2:{cellWidth:32}}});
    y=doc.lastAutoTable.finalY+7;

    /* ---------- insurer outcomes (own page so the panel stays together) ---------- */
    doc.addPage(); y=CONT;
    sectionTitle(`Insurer Outcomes (${c.insurerOutcomes.length})`);
    {
      const ck=["Life","TPD","Trauma","IncomeProtection"];
      const cellText=(cv)=>{ const t=(cv&&cv.type)||"Not assessed"; const d=cleanVal(coverDetailText(cv)); return t+(d?`\n${d}`:""); };
      const body=[], meta=[];
      c.insurerOutcomes.forEach(o=>{
        body.push([(cleanVal(o.insurerName)||"—")+`\nSent ${cleanVal(o.dateSent)||"—"}\nRec'd ${cleanVal(o.dateReceived)||"pending"}`,cellText(o.covers.Life),cellText(o.covers.TPD),cellText(o.covers.Trauma),cellText(o.covers.IncomeProtection)]);
        meta.push({kind:"main",o});
        const extras=[];
        if(cleanVal(o.occRatingDetail)) extras.push("Occupation rating: "+cleanVal(o.occRatingDetail));
        if(cleanVal(o.notes)) extras.push("Notes: "+cleanVal(o.notes));
        if(extras.length){ body.push([{content:extras.join("   ·   "),colSpan:5}]); meta.push({kind:"sub"}); }
      });
      doc.autoTable({...tbl, startY:y,
        styles:{...tbl.styles,fontSize:6.6,cellPadding:1.5},
        headStyles:{...tbl.headStyles,fontSize:6.6,cellPadding:1.8},
        head:[["Insurer","Life","TPD","Trauma","Income Protection"]],
        body: body.length?body:[[{content:"No insurers listed.",colSpan:5,styles:{textColor:MUTED,fontStyle:"italic"}}]],
        columnStyles:{0:{cellWidth:32,fontStyle:"bold"},1:{cellWidth:37.5},2:{cellWidth:37.5},3:{cellWidth:37.5},4:{cellWidth:37.5}},
        didParseCell:(d)=>{
          if(d.section!=="body")return;
          const m=meta[d.row.index]; if(!m)return;
          if(m.kind==="sub"){ d.cell.styles.fontSize=6.3; d.cell.styles.textColor=MUTED; d.cell.styles.fillColor=[252,253,253]; return; }
          if(d.column.index>=1&&d.column.index<=4){
            const cv=m.o.covers[ck[d.column.index-1]];
            d.cell.styles.fillColor=pdfCoverFill(cv&&cv.type);
          }
        }
      });
      y=doc.lastAutoTable.finalY+8;
    }

    /* ---------- important note (end of report) ---------- */
    {
      const note="The outcomes recorded in this report are indicative only. They are based on the information disclosed by the client at the time of pre-assessment and on preliminary feedback from insurers. They do not constitute an offer of cover, a recommendation, or a guarantee of terms. Formal underwriting may identify matters not disclosed at pre-screening and request further information or medical evidence, which may result in different terms, additional loadings, exclusions, a postponement or a decline.";
      const padL=5.5, textW=usable-padL-4;
      // set the font BEFORE measuring so the wrap matches the rendered size (full box width)
      doc.setFont("helvetica","normal"); doc.setFontSize(7.4);
      const lines=doc.splitTextToSize(note, textW);
      const boxH=lines.length*3.7+10.5;
      if(y+boxH>pageH-16){ doc.addPage(); y=CONT; }
      doc.setFillColor(248,250,251); doc.setDrawColor(...LINE); doc.setLineWidth(0.3);
      doc.roundedRect(M,y,usable,boxH,2,2,"FD");
      doc.setFillColor(...PEACH); doc.rect(M,y,1.6,boxH,"F");
      doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(...NAVY);
      doc.text("Disclaimer", M+padL, y+5.4);
      doc.setFont("helvetica","normal"); doc.setFontSize(7.4); doc.setTextColor(...MUTED);
      lines.forEach((ln,i)=>doc.text(ln, M+padL, y+10.2+i*3.7));
      y+=boxH+6;
    }

    /* ---------- header band + footer on every page ---------- */
    const total=doc.internal.getNumberOfPages();
    for(let p=1;p<=total;p++){
      doc.setPage(p);
      if(p>1){ doc.setFillColor(...NAVY); doc.rect(0,0,pageW,14,"F"); doc.setFillColor(...PEACH); doc.rect(0,12.8,pageW,1.2,"F");
        doc.setTextColor(255); doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.text(name, M, 8.6);
        doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(200,215,225);
        doc.text("Insurance Pre-Screening Report", pageW-M, 8.6, {align:"right"}); }
      doc.setDrawColor(...LINE); doc.setLineWidth(0.2); doc.line(M,pageH-11,pageW-M,pageH-11);
      doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(...MUTED);
      doc.text("Confidential — Coastal Advisory Australia · Insurance Pre-Screening", M, pageH-7);
      doc.text(`Ref ${c.id} · ${name}    Page ${p} of ${total}`, pageW-M, pageH-7, {align:"right"});
    }
    if(mode==="print"){
      doc.autoPrint();
      const url=doc.output("bloburl");
      const w=window.open(url,"_blank");
      if(!w) toast("Allow pop-ups to print, or use Export PDF","err");
    } else {
      doc.save(filename);
    }
  }catch(e){ alert("PDF export failed: "+e.message); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=(mode==="print"?"🖨 Print":"⬇ Export PDF"); } }
}
function coverDetailText(cv){
  if(!cv) return "";
  switch(cv.type){
    case "Loading %": return cv.loadingPct?`${cv.loadingPct}% loading`:"";
    case "Loading $": return cv.loadingDollar?`$${cv.loadingDollar} per mille`:"";
    case "Exclusion": return cv.exclusion||"";
    case "Loading % and Exclusion": return `${cv.loadingPct?cv.loadingPct+"% loading":""}${cv.exclusion?(cv.loadingPct?" · ":"")+cv.exclusion:""}`;
    case "Loading $ and Exclusion": return `${cv.loadingDollar?"$"+cv.loadingDollar+" per mille":""}${cv.exclusion?(cv.loadingDollar?" · ":"")+cv.exclusion:""}`;
    case "Declined": return cv.declineReason||"";
    case "Further information": return cv.furtherInfo||"";
    default: return "";
  }
}
function coverBadge(cv){
  const t=(cv&&cv.type)||"Not assessed";
  const d=coverDetailText(cv);
  return `<div class="rcell" style="background:${coverTint(t)}"><b>${esc(t)}</b>${d?`<div class="rcd">${esc(d)}</div>`:""}</div>`;
}
function repPanel(title,rows){
  const body=rows.map(([k,v])=>`<tr><td class="rk">${esc(k)}</td><td class="rv">${(v===0||v)?esc(v):"—"}</td></tr>`).join("");
  return `<div class="rep-panel"><h4>${esc(title)}</h4><table class="rep-kv">${body}</table></div>`;
}
/* LEGACY / UNUSED: the old HTML print layout. Print and Export PDF now both use exportPdf()
   so there is only one report layout to maintain. Kept for reference only — do not wire back up. */
function buildReport(c){
  const cats=[...new Set(c.healthIssues.map(h=>h.category))];
  // health issues table
  let hi = c.healthIssues.map(h=>`<tr>
    <td><b>${esc(h.category)}</b></td>
    <td>${val(h.diagnosis)}<div class="rcd">${val(h.bodyArea)}</div></td>
    <td>${val(h.dateFirstSymptoms)} → ${val(h.dateLastSymptoms)}</td>
    <td>${val(h.treatmentStatus)}</td>
    <td>${val(h.occupationRelated)}</td>
    <td>${val(h.timeOffWork)}</td>
    <td>${h.surgery==="Yes"?("Yes"+(h.surgeryDate?` (${esc(h.surgeryDate)})`:"")):"No"}</td>
    <td>${val(h.fullyRecovered)}</td>
    <td>${val(h.severity)}</td>
    <td>${val(h.assessorNotes)}</td>
  </tr>`).join("");
  if(!c.healthIssues.length) hi=`<tr><td colspan="10" class="rep-empty">No health issues recorded.</td></tr>`;
  // family history
  let fh = c.familyHistory.map(f=>`<tr><td><b>${esc(f.condition)}</b></td><td>${val(f.familyMember)}</td><td>${val(f.ageAtDiagnosis)}</td></tr>`).join("");
  if(!c.familyHistory.length) fh=`<tr><td colspan="3" class="rep-empty">No family history recorded.</td></tr>`;
  // insurers
  let io = c.insurerOutcomes.map(o=>`<tr>
    <td><span class="rins">${esc(o.insurerName)||"—"}<small>Sent ${o.dateSent||"—"} · Rec'd ${o.dateReceived||"pending"}</small></span></td>
    <td>${coverBadge(o.covers.Life)}</td>
    <td>${coverBadge(o.covers.TPD)}</td>
    <td>${coverBadge(o.covers.Trauma)}</td>
    <td>${coverBadge(o.covers.IncomeProtection)}</td>
    <td>${o.occRatingDetail?esc(o.occRatingDetail):"—"}</td>
    <td>${val(o.notes)}</td>
  </tr>`).join("");
  if(!c.insurerOutcomes.length) io=`<tr><td colspan="7" class="rep-empty">No insurers listed.</td></tr>`;

  return `
    <div class="rep-header">
      <div class="rep-logo">CA</div>
      <div class="rep-brand"><b>Coastal Advisory Australia</b><span>Insurance Pre-Screening Report</span></div>
      <div class="rep-meta">
        <div class="rep-name">${esc(c.fullName)}<span class="rep-status ${c.status==="Complete"?"done":"prog"}">${esc(c.status)}</span></div>
        <div class="rep-sub">${esc(c.id)} · ${age(c.dob)} yrs · ${esc(c.gender)} · ${esc(c.complexity||"Unassigned")} · Generated ${todayStr()}</div>
      </div>
    </div>

    <div class="rep-mgmt">
      <span>Complexity: <b>${esc(c.complexity||"Unassigned")}</b></span>
      <span>Pre-screening completed: <b>${c.preScreeningDate||"—"}</b></span>
      <span>Assessment completed: <b>${c.assessmentCompletedDate||"—"}</b></span>
      <span>Days to complete: <b>${(()=>{const d=daysToComplete(c);return d!=null?d+" day"+(d!==1?"s":""):"—";})()}</b></span>
    </div>

    <div class="rep-notes">
      <h4>Assessor Notes &amp; Recommendation</h4>
      <div>${esc(c.assessorNotes && c.assessorNotes.trim() ? c.assessorNotes : "No assessor notes recorded.")}</div>
    </div>

    <div class="rep-panels">
      ${repPanel("Personal",[
        ["Full name",c.fullName],["Date of birth",`${c.dob||""}${c.dob?` (${age(c.dob)} yrs)`:""}`],["Gender",c.gender],["Smoker (12m)",c.smokerLast12m]
      ])}
      ${repPanel("Residency / Travel",[
        ["Living in Australia",c.livingInAustralia],["Citizen or PR",c.citizenOrPR],["Current visa",c.currentVisaDetail],["Applied for PR",c.appliedForPR],
        ["Overseas location",c.overseasLocationDetail],["Travel/live abroad 2yrs",c.plansToTravel2yrs],["Travel plans",c.travelPlansDetail]
      ])}

// Tidy values coming from the Forms automation: ["No"] → No, "| | |" → blank, strip empty pipe segments.
function cleanVal(v){
  if(v===0) return "0";
  if(v==null||v==="") return "";
  let s=String(v).trim();
  if(/^\[.*\]$/.test(s)){
    try{ const a=JSON.parse(s); if(Array.isArray(a)) s=a.filter(x=>x!=null&&String(x).trim()!=="").join(", "); }
    catch(e){ s=s.replace(/^\[|\]$/g,"").replace(/"/g,"").trim(); }
  }
  if(/^[\s|,;·-]*$/.test(s)) return "";           // separator-only junk
  s=s.split("|").map(x=>x.trim()).filter(x=>x!=="").join(" | ");
  return s;
}
function bmi(c){ if(!c.heightCm||!c.weightKg)return""; const m=c.heightCm/100; return (c.weightKg/(m*m)).toFixed(1); }
function bmiCat(b){ b=parseFloat(b); if(!b)return""; if(b<18.5)return"underweight"; if(b<25)return"healthy"; if(b<30)return"overweight"; return"obese"; }
function bmiFlagged(b){ b=parseFloat(b); return b>=28; }
function hwLine(c){ const b=bmi(c); return (c.heightCm?c.heightCm+"cm":"")+(c.weightKg?" / "+c.weightKg+"kg":"")+(b?` (BMI ${b}${bmiFlagged(b)?" ⚠ elevated (≥28)":""})`:""); }
function updateBmi(){
  const el=document.getElementById("f_bmiDisplay"); if(!el)return;
  const h=parseFloat(gv("f_heightCm")), w=parseFloat(gv("f_weightKg"));
  if(h>0&&w>0){ const m=h/100, b=(w/(m*m)).toFixed(1), flag=bmiFlagged(b);
    el.value=b+" — "+bmiCat(b)+(flag?"   ⚠ FLAG (≥28)":"");
    el.style.background=flag?"#fbe9e6":"#eef3f6"; el.style.color=flag?"#b3402f":""; el.style.fontWeight=flag?"700":"";
  } else { el.value=""; el.style.background="#eef3f6"; el.style.color=""; el.style.fontWeight=""; }
}

// Render the AI summary preserving line breaks (so it survives copy-paste into email) + bold section headings.
function summaryHtml(text){
  return (text||"").split("\n").map(line=>{
    const t=line.trim();
    const isHeading = t.length>0 && t.length<=42 && t===t.toUpperCase() && /[A-Z]/.test(t);
    return isHeading?`<strong>${esc(line)}</strong>`:esc(line);
  }).join("<br>");
}

// Record that we've sent to this insurer: add to Insurer Outcomes with today's Sent date.
// Never duplicates; never overwrites an existing Sent date.
function recordInsurerSent(c, insurerKey){
  const nm=String(insurerKey||"").replace(/\s*\(.*\)\s*$/,"").trim();   // "PPS Mutual (Murray)" → "PPS Mutual"
  if(!nm) return "none";
  const existing=c.insurerOutcomes.find(io=>(io.insurerName||"").trim().toLowerCase()===nm.toLowerCase());
  if(existing){
    if(!existing.dateSent){ existing.dateSent=todayStr(); persist(saveInsurerRemote(c,existing)); return "dated"; }
    return "exists";
  }
  const io=newInsurerCard(nm);
  io.dateSent=todayStr();
  c.insurerOutcomes.push(io);
  persist(saveInsurerRemote(c,io));
  return "added";
}
function announceRecorded(res, nm){
  if(res==="added") toast(nm+" added to Insurer Outcomes (sent "+todayStr()+")");
  else if(res==="dated") toast(nm+" already listed — sent date set to "+todayStr());
  else if(res==="exists") toast(nm+" is already in Insurer Outcomes — not changed");
}
function sendToInsurer(id){
  const c=getCase(id); if(!c)return;
  const insurer=gv("sendInsurer");
  const ct=INSURER_CONTACTS[insurer]||{};
  const shortName=String(insurer||"").replace(/\s*\(.*\)\s*$/,"").trim();
  if(ct.portal){
    const res=recordInsurerSent(c,insurer);
    closeModal(); renderDetail(id);
    alert(insurer+" pre-assessments are submitted via the "+insurer+" portal, not by email.\n\n"+
      (res==="exists" ? insurer+" is already listed in Insurer Outcomes." : insurer+" has been recorded in Insurer Outcomes with today's sent date."));
    return;
  }
  const subject=(ct.subject||"XX - Pre-Assessment").replace("XX", initials(c));
  const preamble="Hi,\n\nPlease find our pre-screening summary below for consideration.\n\n";
  const params=[];
  if(ct.cc) params.push("cc="+encodeURIComponent(ct.cc));
  params.push("subject="+encodeURIComponent(subject));
  params.push("body="+encodeURIComponent(preamble));
  const url="mailto:"+encodeURIComponent(ct.to||"")+"?"+params.join("&");
  const openMail=()=>{
    closeModal();
    const res=recordInsurerSent(c,insurer);
    renderDetail(id);
    if(!ct.to) toast("No recipient set for "+insurer+" — add it in Outlook","err");
    else announceRecorded(res, shortName);
    window.location.href=url;
  };
  const summary=c.cleanSummary||"";
  if(summary && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(summary).then(openMail, ()=>{ toast("Couldn't copy summary; opening email anyway","err"); openMail(); });
  } else { openMail(); }
}

function coverCell(caseId,ioId,key,cv){
  cv=cv||blankCover();
  const t=cv.type||"Not assessed";
  const needPct = t==="Loading %"||t==="Loading % and Exclusion";
  const needDollar = t==="Loading $"||t==="Loading $ and Exclusion";
  const needExcl = t==="Exclusion"||t==="Loading % and Exclusion"||t==="Loading $ and Exclusion";
  const needDecline = t==="Declined";
  const needFurther = t==="Further information";
  const setF=(f)=>`onchange="setCoverField('${caseId}','${ioId}','${key}','${f}',this.value)"`;
  let extra="";
  if(needPct) extra+=`<select class="mini" ${setF('loadingPct')}><option value="">— loading % —</option>${PCT_OPTIONS.map(p=>`<option value="${p}" ${p===cv.loadingPct?'selected':''}>${p}%</option>`).join("")}</select>`;
  if(needDollar) extra+=`<select class="mini" ${setF('loadingDollar')}><option value="">— $ per mille —</option>${DOLLAR_OPTIONS.map(d=>`<option value="${d}" ${d===cv.loadingDollar?'selected':''}>$${d} per mille</option>`).join("")}</select>`;
  if(needExcl) extra+=`<input class="mini" type="text" value="${esc(cv.exclusion)}" placeholder="Exclusion wording…" ${setF('exclusion')}>`;
  if(needDecline) extra+=`<input class="mini" type="text" value="${esc(cv.declineReason)}" placeholder="Decline reason…" ${setF('declineReason')}>`;
  if(needFurther) extra+=`<input class="mini" type="text" value="${esc(cv.furtherInfo||"")}" placeholder="What further info is required…" ${setF('furtherInfo')}>`;
  const tint=coverTint(t);
  return `<td class="covercell">
    <select class="celltype" style="background:${tint}" onchange="setCoverType('${caseId}','${ioId}','${key}',this.value)">
      ${COVER_OUTCOMES.map(o=>`<option ${o===t?'selected':''}>${o}</option>`).join("")}
    </select>${extra}
  </td>`;
}
function coverTint(t){
  const dark=document.body.classList.contains("dark");
  if(dark){
    if(t==="Standard")return"#14301f";
    if(t==="Loading %"||t==="Loading $")return"#3a2c17";
    if(t==="Exclusion")return"#3b2a1a";
    if(t==="Loading % and Exclusion"||t==="Loading $ and Exclusion")return"#432c1a";
    if(t==="Declined")return"#3a1e19";
    if(t==="Further information")return"#17293d";
    return"#12242f";
  }
  if(t==="Standard")return"#e6f6ee";
  if(t==="Loading %"||t==="Loading $")return"#fff4e7";
  if(t==="Exclusion")return"#fdeee0";
  if(t==="Loading % and Exclusion"||t==="Loading $ and Exclusion")return"#ffe3cf";
  if(t==="Declined")return"#fbe9e6";
  if(t==="Further information")return"#e7f0fb";
  return"#ffffff";
}

    "fullName","dob","gender","smokerLast12m",
    "livingInAustralia","citizenOrPR","currentVisaDetail","appliedForPR","overseasLocationDetail","plansToTravel2yrs","travelPlansDetail",
    "hazardousPastimes","hazardousActivityDetail","alcoholPerWeek","alcoholReductionAdvised","alcoholAdviceDate","recreationalDrugs10yrs","drugDetail",
    "currentlyWorking","occupation","employer","annualIncome","employmentStatus","hazardousDuties","dutiesBreakdown","hoursWeeksWorked",
    "selfEmploymentDetail","bonusCommissionOver20","secondJob","secondJobDetail","plansToChangeJob","jobChangeDetail","bankruptcyStatus","bankruptcyDetail",
    "heightCm","weightKg","weightChanged12m","weightChangeDetail","highBloodPressure","bpDetail","highCholesterol","cholesterolDetail",
    "rawForm"];
  if(!gv("f_fullName")){ alert("Full name is required."); return; }

  else { c={id:uid("PS"),status:"In Progress",createdDate:todayStr(),healthIssues:[],insurerOutcomes:defaultPanel(),familyHistory:[]}; DB.unshift(c); }
  fields.forEach(f=>{ c[f]=gv("f_"+f); });

  try{
    await saveSubmissionRemote(c);
    if(isNew){ for(const io of c.insurerOutcomes){ const fl=ioFields(io); fl.SubmissionLookupId=Number(c.spId); const it=await gCreate("insurerOutcomes",fl); io.spId=it.id; } }
    setSync("saved");

}

function toggleStatus(id){
  const c=getCase(id);

  else {
    if(!(c.assessorNotes&&c.assessorNotes.trim()) && !confirm("No assessor notes / recommendation have been added.\n\nMark this case Complete anyway?")) return;
    c.status="Complete"; c.assessmentCompletedDate=c.assessmentCompletedDate||todayStr();

async function deleteCase(id){
  const c=getCase(id); if(!c) return;
  if(!confirm(`Delete "${c.fullName||"this case"}" and all its health issues, insurer outcomes and family history?\n\nThis cannot be undone.`)) return;
  DB=DB.filter(x=>x.id!==id);
  showCases();
  setSync("saving");
  try{
    for(const h of c.healthIssues) if(h.spId) await gDelete("healthIssues",h.spId);
    for(const io of c.insurerOutcomes) if(io.spId) await gDelete("insurerOutcomes",io.spId);

  }catch(e){ setSync("error", e.message); }
}

/* ===================== MSAL AUTH + GRAPH (phase 2a: connect + verify) ===================== */
let msalApp=null;
function initMsal(){
  if(msalApp) return msalApp;
  if(typeof msal==="undefined") throw new Error("MSAL library not loaded (msal-browser.min.js missing).");
  msalApp = new msal.PublicClientApplication({
    auth:{ clientId:GRAPH_CONFIG.clientId, authority:"https://login.microsoftonline.com/"+GRAPH_CONFIG.tenantId, redirectUri: window.location.origin + window.location.pathname },
    cache:{ cacheLocation:"localStorage" }
  });
  return msalApp;
}
async function signIn(){
  initMsal();
  const existing = msalApp.getActiveAccount() || msalApp.getAllAccounts()[0];
  if(existing){ msalApp.setActiveAccount(existing); return existing; }
  const res = await msalApp.loginPopup({ scopes: GRAPH_CONFIG.scopes });
  msalApp.setActiveAccount(res.account);
  return res.account;
}
async function getToken(){
  initMsal();
  const acct = msalApp.getActiveAccount() || msalApp.getAllAccounts()[0] || await signIn();
  try{ return (await msalApp.acquireTokenSilent({ scopes:GRAPH_CONFIG.scopes, account:acct })).accessToken; }
  catch(e){ return (await msalApp.acquireTokenPopup({ scopes:GRAPH_CONFIG.scopes })).accessToken; }
}
async function graphGet(path){
  const token = await getToken();
  const r = await fetch("https://graph.microsoft.com/v1.0"+path, { headers:{ Authorization:"Bearer "+token } });
  if(!r.ok) throw new Error("Graph "+r.status+": "+(await r.text()).slice(0,400));
  return r.json();
}

/* ===================== GRAPH DATA LAYER (live read/write) ===================== */
const GRAPH = { siteId:null, lists:{} };

async function graphGetAll(path){
  let url = "https://graph.microsoft.com/v1.0"+path, out=[];
  const token = await getToken();
  while(url){
    const r = await fetch(url, { headers:{ Authorization:"Bearer "+token } });
    if(!r.ok) throw new Error("Graph "+r.status+": "+(await r.text()).slice(0,300));
    const j = await r.json(); out = out.concat(j.value||[]); url = j["@odata.nextLink"]||null;
  }
  return out;
}
async function graphSend(method, path, body){
  const token = await getToken();
  const r = await fetch("https://graph.microsoft.com/v1.0"+path, {
    method, headers:{ Authorization:"Bearer "+token, "Content-Type":"application/json" },
    body: body?JSON.stringify(body):undefined
  });
  if(!r.ok) throw new Error("Graph "+r.status+": "+(await r.text()).slice(0,300));
  return r.status===204?null:r.json();
}
async function resolveGraph(){
  if(GRAPH.siteId) return;
  const site = await graphGet("/sites/"+GRAPH_CONFIG.siteHostname+":"+GRAPH_CONFIG.sitePath);
  GRAPH.siteId = site.id;
  const lists = await graphGet("/sites/"+encodeURIComponent(site.id)+"/lists?$select=id,displayName&$top=200");
  for(const key of Object.keys(GRAPH_CONFIG.lists)){
    const m = lists.value.find(l=>l.displayName===GRAPH_CONFIG.lists[key]);
    if(!m) throw new Error("List not found: "+GRAPH_CONFIG.lists[key]);
    GRAPH.lists[key] = m.id;
  }
}
function listPath(key){ return "/sites/"+encodeURIComponent(GRAPH.siteId)+"/lists/"+GRAPH.lists[key]; }

/* ---- conversions ---- */
function inDate(v){ return v?String(v).slice(0,10):""; }
function outDate(v){ return v?(String(v).slice(0,10)+"T00:00:00Z"):null; }
function outNum(v){ return (v===""||v==null)?null:Number(v); }
function outStr(v){ return (v===""||v==null)?null:String(v); }

const SUB_MAP = {
  status:"Status", complexity:"Complexity", preScreeningDate:"PreScreeningDate", assessmentCompletedDate:"AssessmentCompletedDate",
  rawForm:"RawForm", cleanSummary:"CleanSummary", assessorNotes:"AssessorNotes", fullName:"FullName", dob:"DOB", gender:"Gender", smokerLast12m:"SmokerLast12m",
  livingInAustralia:"LivinginAustralia", overseasLocationDetail:"OverseasLocationDetail", citizenOrPR:"CitizenOrPR",
  currentVisaDetail:"CurrentVisaDetail", appliedForPR:"AppliedForPR", plansToTravel2yrs:"PlansToTravelOrLive2yrs", travelPlansDetail:"TravelPlansDetail",
  hazardousPastimes:"HazardousPastimes", hazardousActivityDetail:"HazardousActivityDetail", alcoholPerWeek:"AlcoholPerWeek",
  alcoholReductionAdvised:"AlcoholReductionAdvised", alcoholAdviceDate:"AlcoholAdviceDate", recreationalDrugs10yrs:"RecreationalDrugs10yrs", drugDetail:"DrugDetail",
  currentlyWorking:"CurrentlyWorking", occupation:"Occupation", employer:"Employer", annualIncome:"AnnualIncome",
  hazardousDuties:"HazardousDuties", dutiesBreakdown:"DutiesBreakdown", hoursWeeksWorked:"HoursWeeksWorked", employmentStatus:"EmploymentStatus",
  selfEmploymentDetail:"SelfEmploymentDetail", bonusCommissionOver20:"BonusCommissionOver20", secondJob:"SecondJob", secondJobDetail:"SecondJobDetail",
  plansToChangeJob:"PlansToChangeJob", jobChangeDetail:"JobChangeDetail", bankruptcyStatus:"BankruptcyStatus", bankruptcyDetail:"BankruptcyDetail",
  heightCm:"HeightCm", weightKg:"WeightKg", weightChanged12m:"WeightChanged12m", weightChangeDetail:"WeightChangeDetail",
  highBloodPressure:"HighBloodPressure", bpDetail:"BPDetail", highCholesterol:"HighCholesterol", cholesterolDetail:"CholesterolDetail"
};
const SUB_DATES = ["preScreeningDate","assessmentCompletedDate","dob"];
const SUB_NUMS  = ["annualIncome","heightCm","weightKg"];
function subToApp(item){
  const f=item.fields||{}, c={ id:String(item.id), spId:item.id, healthIssues:[], insurerOutcomes:[], familyHistory:[] };
  for(const k in SUB_MAP){ const v=f[SUB_MAP[k]]; c[k]=(v==null?"":v); }
  SUB_DATES.forEach(k=>c[k]=inDate(c[k]));
  SUB_NUMS.forEach(k=>c[k]=(c[k]===""||c[k]==null)?"":Number(c[k]));
  return c;
}
function subFields(c){
  const out={ Title: c.fullName||"(unnamed)" };
  for(const k in SUB_MAP){
    if(k==="cleanSummary") continue; // AI-owned, read-only from the app
    let v=c[k];
    if(SUB_DATES.includes(k)) v=outDate(v);
    else if(SUB_NUMS.includes(k)) v=outNum(v);
    else v=outStr(v);
    out[SUB_MAP[k]]=v;
  }
  return out;
}
const HI_MAP = { category:"Category", diagnosis:"Diagnosis", bodyArea:"BodyArea", dateFirstSymptoms:"DateFirstSymptoms", dateLastSymptoms:"DateLastSymptoms", treatmentStatus:"TreatmentStatus", occupationRelated:"OccupationRelated", timeOffWork:"TimeOffWork", surgery:"Surgery", surgeryDate:"SurgeryDate", fullyRecovered:"FullyRecovered", severity:"Severity", assessorNotes:"AssessorNotes" };
function hiToApp(item){ const f=item.fields||{}, h={ id:String(item.id), spId:item.id }; for(const k in HI_MAP){ const v=f[HI_MAP[k]]; h[k]=(v==null?"":v); } h.surgeryDate=inDate(h.surgeryDate); return h; }
function hiFields(h){ const out={ Title: h.diagnosis||"Health issue" }; for(const k in HI_MAP){ out[HI_MAP[k]]= (k==="surgeryDate")?outDate(h[k]):outStr(h[k]); } return out; }

const FH_MAP = { condition:"Condition", familyMember:"FamilyMember", ageAtDiagnosis:"AgeAtDiagnosis" };
function fhToApp(item){ const f=item.fields||{}; return { id:String(item.id), spId:item.id, condition:f.Condition||"", familyMember:f.FamilyMember||"", ageAtDiagnosis:(f.AgeAtDiagnosis==null?"":Number(f.AgeAtDiagnosis)) }; }
function fhFields(f){ return { Title:f.condition||"Family history", Condition:outStr(f.condition), FamilyMember:outStr(f.familyMember), AgeAtDiagnosis:outNum(f.ageAtDiagnosis) }; }

const COVER_KEYS = ["Life","TPD","Trauma","IncomeProtection"];
function ioToApp(item){
  const f=item.fields||{}, io={ id:String(item.id), spId:item.id, insurerName:f.InsurerName||"", dateSent:inDate(f.DateSent), dateReceived:inDate(f.DateReceived), occRatingDetail:f.OccRatingDetail||"", notes:f.Notes||"", covers:{} };
  COVER_KEYS.forEach(k=>{ io.covers[k]={ type:f[k+"Outcome"]||"Not assessed", loadingPct:(f[k+"LoadingPct"]==null?"":String(f[k+"LoadingPct"])), loadingDollar:(f[k+"LoadingDollar"]==null?"":String(f[k+"LoadingDollar"])), exclusion:f[k+"Exclusion"]||"", declineReason:f[k+"DeclineReason"]||"", furtherInfo:f[k+"FurtherInfo"]||"" }; });
  return io;
}
function ioFields(io){
  const out={ Title:io.insurerName||"Insurer", InsurerName:outStr(io.insurerName), DateSent:outDate(io.dateSent), DateReceived:outDate(io.dateReceived), OccRatingDetail:outStr(io.occRatingDetail), Notes:outStr(io.notes) };
  COVER_KEYS.forEach(k=>{ const cv=io.covers[k]||{}; out[k+"Outcome"]=outStr(cv.type); out[k+"LoadingPct"]=outNum(cv.loadingPct); out[k+"LoadingDollar"]=outNum(cv.loadingDollar); out[k+"Exclusion"]=outStr(cv.exclusion); out[k+"DeclineReason"]=outStr(cv.declineReason); out[k+"FurtherInfo"]=outStr(cv.furtherInfo); });
  return out;
}

/* ---- CRUD ---- */
async function gCreate(key, fields){ return graphSend("POST", listPath(key)+"/items", { fields }); }
async function gPatch(key, spId, fields){ return graphSend("PATCH", listPath(key)+"/items/"+spId+"/fields", fields); }
async function gDelete(key, spId){ return graphSend("DELETE", listPath(key)+"/items/"+spId); }

/* ---- sync status + toast ---- */
function setSync(state,msg){
  const el=document.getElementById("syncStatus"); if(!el)return;
  if(state==="saving"){ el.textContent=msg||"Saving…"; el.className="syncstat busy"; }
  else if(state==="saved"){ el.textContent=msg||"All changes saved"; el.className="syncstat ok"; }
  else if(state==="error"){ el.textContent="⚠ Not saved"; el.className="syncstat err"; toast("Couldn't save to SharePoint: "+(msg||""),"err"); }
  else { el.textContent=""; el.className="syncstat"; }
}
let toastTimer=null;
function toast(msg,type){
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.className="show"+(type==="err"?" err":"");
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.className=""; }, type==="err"?7000:2500);
}
// wrap a persistence promise with sync UI
async function persist(promise){ setSync("saving"); try{ await promise; setSync("saved"); }catch(e){ setSync("error", e.message); } }

/* ---- entity persistence (optimistic: UI already updated) ---- */
async function saveSubmissionRemote(c){ if(c.spId){ await gPatch("submissions",c.spId,subFields(c)); } else { const it=await gCreate("submissions",subFields(c)); c.spId=it.id; } }
async function saveHealthRemote(c,h){ if(h.spId){ await gPatch("healthIssues",h.spId,hiFields(h)); } else { const fl=hiFields(h); fl.SubmissionLookupId=Number(c.spId); const it=await gCreate("healthIssues",fl); h.spId=it.id; } }
async function saveFamilyRemote(c,f){ if(f.spId){ await gPatch("familyHistory",f.spId,fhFields(f)); } else { const fl=fhFields(f); fl.SubmissionLookupId=Number(c.spId); const it=await gCreate("familyHistory",fl); f.spId=it.id; } }
async function saveInsurerRemote(c,io){ if(io.spId){ await gPatch("insurerOutcomes",io.spId,ioFields(io)); } else { const fl=ioFields(io); fl.SubmissionLookupId=Number(c.spId); const it=await gCreate("insurerOutcomes",fl); io.spId=it.id; } }

/* ---- load all data from SharePoint ---- */
async function initData(){
  document.getElementById("view-dashboard").classList.remove("hidden");
  document.getElementById("view-detail").classList.add("hidden");
  document.getElementById("view-dashboard").innerHTML='<div class="empty" style="margin-top:40px">Loading cases from SharePoint…</div>';
  try{
    await resolveGraph();
    await loadFromGraph();
    setSync("saved","Connected");
    showDashboard();
  }catch(e){
    document.getElementById("view-dashboard").innerHTML='<div class="empty" style="margin-top:40px">Couldn’t load from SharePoint.<br><br><span class="muted">'+esc(e.message)+'</span><br><br><button class="btn" onclick="initData()">Retry</button></div>';
    setSync("error", e.message);
  }
}
async function loadFromGraph(){
  const [subs,his,ios,fhs] = await Promise.all([
    graphGetAll(listPath("submissions")+"/items?$expand=fields"),
    graphGetAll(listPath("healthIssues")+"/items?$expand=fields"),
    graphGetAll(listPath("insurerOutcomes")+"/items?$expand=fields"),
    graphGetAll(listPath("familyHistory")+"/items?$expand=fields")
  ]);
  const cases = subs.map(subToApp);
  const byId = {}; cases.forEach(c=>byId[String(c.spId)]=c);
  const parentOf = it => byId[String((it.fields||{}).SubmissionLookupId)];
  his.forEach(it=>{ const c=parentOf(it); if(c) c.healthIssues.push(hiToApp(it)); });
  ios.forEach(it=>{ const c=parentOf(it); if(c) c.insurerOutcomes.push(ioToApp(it)); });
  fhs.forEach(it=>{ const c=parentOf(it); if(c) c.familyHistory.push(fhToApp(it)); });
  DB = cases;
}

/* ===================== AUTH GATE ===================== */
async function signInGate(){
  const btn=document.getElementById("loginBtn"), err=document.getElementById("loginErr");
  err.style.display="none";
  try{
    initMsal();
    btn.disabled=true; btn.textContent="Signing in…";
    let acct = msalApp.getActiveAccount() || msalApp.getAllAccounts()[0];
    if(!acct){ const res=await msalApp.loginPopup({ scopes: GRAPH_CONFIG.loginScopes, prompt:"select_account" }); acct=res.account; }
    if(acct.tenantId && acct.tenantId!==GRAPH_CONFIG.tenantId){
      await msalApp.logoutPopup({ account:acct }).catch(()=>{});
      throw new Error("That account isn't part of the Coastal Advisory tenancy. Please sign in with your Coastal Advisory Microsoft 365 account.");
    }
    msalApp.setActiveAccount(acct);
    enterApp(acct);
  }catch(e){
    const msg=(e&&e.message)?e.message:String(e);
    err.innerHTML=esc(msg)+'<br><br>Redirect URI to register in Entra (Authentication → SPA):<br><b>'+esc(window.location.origin+window.location.pathname)+'</b>';
    err.style.display="block";
  }finally{
    btn.disabled=false; btn.innerHTML='<svg class="ms-logo" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg> Sign in with Microsoft';
  }
}
function enterApp(acct){
  document.body.classList.remove("signed-out");
  const chip=document.getElementById("userChip");
  const who=acct?(acct.name||acct.username||"Signed in"):"Signed in";
  chip.innerHTML='<span class="uc-name">'+esc(who)+'</span><button class="uc-out" onclick="signOutUser()">Sign out</button>';
  initData();
}
function signOutUser(){
  try{ const acct=msalApp.getActiveAccount(); msalApp.logoutPopup({ account:acct }).catch(()=>{}); }catch(e){}
  document.body.classList.add("signed-out");
  document.getElementById("userChip").innerHTML="";
}

/* ===================== THEME ===================== */
const THEME_KEY="caa_theme";
function applyTheme(dark){
  document.body.classList.toggle("dark", !!dark);
  const b=document.getElementById("themeBtn");
  if(b){ b.textContent = dark?"☀":"🌙"; b.title = dark?"Switch to light mode":"Switch to dark mode"; }
}
function toggleTheme(){
  const dark=!document.body.classList.contains("dark");
  applyTheme(dark);
  try{ localStorage.setItem(THEME_KEY, dark?"dark":"light"); }catch(e){}
  if(openCaseId) renderDetail(openCaseId);   // re-render inline cover tints (set via inline style)
}
function initTheme(){
  let pref=null;
  try{ pref=localStorage.getItem(THEME_KEY); }catch(e){}
  if(pref===null && window.matchMedia) pref = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(pref==="dark");
}

/* ===================== BOOT ===================== */
(function boot(){
  initTheme();
  document.addEventListener("keydown",e=>{ if(e.key==="Escape")closeModal(); });
  try{
    initMsal();
    const acct = msalApp.getActiveAccount() || msalApp.getAllAccounts()[0];
    if(acct && (!acct.tenantId || acct.tenantId===GRAPH_CONFIG.tenantId)){ msalApp.setActiveAccount(acct); enterApp(acct); return; }
  }catch(e){ /* MSAL not available — stay on login screen */ }
  document.body.classList.add("signed-out"); // show login
})();
